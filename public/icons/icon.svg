<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1a38"/>
      <stop offset="100%" stop-color="#030611"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00f3ff" stroke-width="6" stroke-dasharray="16 10" opacity="0.6"/>

  <!-- Thruster Flare -->
  <polygon points="236,360 276,360 256,430" fill="#ffbe0b" filter="url(#glow)"/>

  <!-- Spaceship Fuselage -->
  <polygon points="256,80 340,360 256,330 172,360" fill="#1a2d4c" stroke="#00f3ff" stroke-width="6"/>

  <!-- Wings Accent -->
  <polygon points="256,160 410,340 340,340" fill="#00f3ff" opacity="0.8"/>
  <polygon points="256,160 102,340 172,340" fill="#00f3ff" opacity="0.8"/>

  <!-- Cockpit Glass -->
  <ellipse cx="256" cy="220" rx="24" ry="50" fill="#00f3ff" filter="url(#glow)"/>
  <ellipse cx="256" cy="210" rx="14" ry="30" fill="#ffffff"/>
</svg>
